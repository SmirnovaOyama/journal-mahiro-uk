<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Link preview card</title>
        <!-- The 1200 by 630 card shown when a link is shared. render.mjs
             opens this page once and calls draw() for every card.
             Colours and type are hrt.mahiro.uk's (src/styles/oyama-tokens.css,
             light), laid out as its own card is (Oyama's design/og/og.html):
             the white page, the system type, the host at the top right, the
             drawing in terracotta, figures in the reading face. -->
        <style>
            :root {
                --bg: #ffffff;
                --text: oklch(20.5% 0.006 90);
                --text-muted: oklch(51.7% 0.013 90);
                --border: oklch(91% 0.007 89);
                --surface-muted: oklch(97.3% 0.004 90);
                --wash: oklch(97.5% 0.012 45);
                --shade: oklch(93% 0.032 44);
                --brand: oklch(65.8% 0.1131 39.15);
                --accent: oklch(55.5% 0.118 38);
                --danger: oklch(53% 0.19 27);
                --warning: oklch(53% 0.13 55);
                --info: oklch(52% 0.17 255);
                --positive: oklch(52% 0.11 162);
                --chart-grid: oklch(94.5% 0.004 88);
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                width: 1200px;
                height: 630px;
                overflow: hidden;
                background: var(--bg);
                color: var(--text);
                font-family:
                    -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'PingFang SC', 'Hiragino Sans',
                    ui-sans-serif, system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            .card {
                position: relative;
                width: 1200px;
                height: 630px;
                padding: 72px 88px 0;
            }
            .host {
                position: absolute;
                top: 64px;
                right: 64px;
                font-size: 24px;
                color: var(--text-muted);
            }
            .foot {
                position: absolute;
                left: 80px;
                bottom: 44px;
                display: flex;
                align-items: center;
                gap: 14px;
                font-size: 24px;
                color: var(--text-muted);
            }
            .foot img {
                width: 40px;
                height: 40px;
                border-radius: 9px;
            }
            .brand {
                position: absolute;
                left: 88px;
                bottom: 52px;
                font-size: 24px;
                color: var(--text-muted);
            }
            .brand b {
                color: var(--text);
                font-weight: 600;
            }
            .title {
                font-family: 'SF Pro Display', -apple-system, 'PingFang SC', sans-serif;
                font-weight: 400;
                letter-spacing: -0.03em;
                line-height: 1.02;
                white-space: nowrap;
            }
            .muted {
                color: var(--text-muted);
            }
            .reading {
                font-family: 'SF Pro Display', -apple-system, sans-serif;
                font-weight: 300;
                letter-spacing: -0.035em;
                font-variant-numeric: tabular-nums;
                line-height: 1;
            }
            svg.art {
                fill: none;
                stroke: var(--brand);
                stroke-width: 1.9;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            svg.art .w {
                fill: var(--wash);
                stroke: none;
            }
            svg.art .s {
                fill: var(--shade);
                stroke: none;
            }
            .tile {
                width: 84px;
                height: 84px;
                border-radius: 18px;
                background: var(--surface-muted);
                display: grid;
                place-items: center;
            }
            .tile svg {
                width: 75% !important;
                height: 75% !important;
            }
            .picture {
                display: block;
                object-fit: cover;
            }
            .mol {
                color: var(--brand);
            }
            .mol svg {
                display: block;
                width: 100%;
                height: 100%;
            }
            .mol line,
            .mol path,
            .mol polygon,
            .mol circle {
                vector-effect: non-scaling-stroke;
            }
            .mol line {
                stroke-width: var(--line, 3.4px);
            }
            .mol text {
                font-family: -apple-system, 'SF Pro Text', sans-serif;
                font-weight: 500;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script>
            const $ = (html) => {
                const t = document.createElement('template');
                t.innerHTML = html.trim();
                return t.content.firstChild;
            };
            const esc = (s) =>
                String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

            /* The site's own doodles (src/components/Doodle.tsx), on 40 by 40. */
            const DOODLE = {
                lens: `<path class="w" d="M17.2 8 C 22.4 7.8, 26.2 11.8, 26 17 C 25.9 22.2, 22 26.1, 16.9 26 C 11.8 25.9, 8 22, 8.1 16.9 C 8.2 11.9, 12.2 8.1, 17.2 8 Z"/><path class="s" d="M23.6 25.4 C 25.8 27.6, 28 29.8, 30.2 32 C 31.2 33, 32.8 32.8, 33.4 31.8 C 34 30.8, 33.8 29.8, 33 29 C 30.8 26.8, 28.6 24.6, 26.4 22.6 Z"/><path d="M17.2 8 C 22.4 7.8, 26.2 11.8, 26 17 C 25.9 22.2, 22 26.1, 16.9 26 C 11.8 25.9, 8 22, 8.1 16.9 C 8.2 11.9, 12.2 8.1, 17.8 8.1"/><path stroke-width="1.6" d="M12.3 15.6 C 12.6 13.4, 14.1 11.7, 16.3 11.2"/><path d="M23.4 25.6 C 25.6 27.8, 27.9 30, 30.2 32.1 C 31.3 33.1, 32.9 32.9, 33.5 31.8 C 34 30.8, 33.7 29.7, 32.9 28.9 C 30.7 26.8, 28.6 24.6, 26.4 22.5"/>`,
                flask: `<path class="w" d="M10.6 26 C 15.4 25.2, 24.6 26.8, 29.4 25.8 C 30.8 28.2, 31.9 30.2, 32.4 31.6 C 32.8 33, 31.8 33.8, 30.4 33.8 C 23.4 34, 16.6 34, 9.6 33.8 C 8.2 33.8, 7.2 32.8, 7.8 31.6 C 8.6 29.8, 9.6 27.8, 10.6 26 Z"/><path d="M16.6 7.6 C 16.8 11, 16.7 14.4, 16.5 17.4 C 13.8 22.2, 10.6 27.2, 7.8 31.6 C 7.2 32.8, 8.2 33.8, 9.6 33.8 C 16.6 34, 23.4 34, 30.4 33.8 C 31.8 33.8, 32.8 33, 32.4 31.6 C 29.6 27, 26.4 22.2, 23.6 17.4 C 23.4 14.4, 23.3 11, 23.5 7.2"/><path d="M14.4 7.7 C 18 7.2, 21.8 7.5, 25.6 7.3"/><path stroke-width="1.6" d="M10.6 26 C 15.4 25.2, 24.6 26.8, 29.4 25.8"/><path stroke-width="1.4" d="M17.4 30.6 C 17.4 29.8, 18.1 29.2, 18.9 29.3 C 19.6 29.4, 20.1 30.1, 19.9 30.8 C 19.7 31.5, 18.9 31.8, 18.2 31.5"/><path stroke-width="1.3" d="M23.6 29.4 C 23.7 28.9, 24.2 28.6, 24.7 28.8 C 25.2 29, 25.3 29.6, 25 30"/><path stroke-width="1.3" d="M20.6 21.6 C 20.7 21, 21.3 20.7, 21.8 20.9 C 22.3 21.1, 22.4 21.7, 22.1 22.1"/>`,
                heart: `<path class="w" d="M20 31 C 14 26.6, 8.4 22.4, 8.6 16.4 C 8.8 12, 12.4 9.4, 15.8 9.8 C 18 10, 19.4 11.6, 20 13.4 C 20.8 11.4, 22.4 9.8, 24.8 9.8 C 28.4 9.8, 31.6 12.6, 31.2 17 C 30.8 22.6, 25.6 26.8, 20 31 Z"/><path d="M20 31 C 14 26.6, 8.4 22.4, 8.6 16.4 C 8.8 12, 12.4 9.4, 15.8 9.8 C 18 10, 19.4 11.6, 20 13.4 C 20.8 11.4, 22.4 9.8, 24.8 9.8 C 28.4 9.8, 31.6 12.6, 31.2 17 C 30.8 22.6, 25.6 26.8, 19.6 31.4"/>`,
                capsule: `<path class="w" d="M9.4 25.4 C 6.8 22.8, 7.4 18.8, 10.4 16.2 L 16.4 10.6 C 19.2 8, 23.4 8.2, 25.8 10.8 C 28.2 13.4, 28 17.4, 25.4 20 L 19.4 25.8 C 16.4 28.6, 12 28.4, 9.4 25.4 Z"/><path d="M9.4 25.4 C 6.8 22.8, 7.4 18.8, 10.4 16.2 L 16.4 10.6 C 19.2 8, 23.4 8.2, 25.8 10.8 C 28.2 13.4, 28 17.4, 25.4 20 L 19.4 25.8 C 16.4 28.6, 12 28.4, 9.2 25.2"/><path d="M13.6 13.4 C 16 15.8, 18.4 18.2, 20.8 20.6"/>`,
            };
            const doodle = (name, size) =>
                `<svg class="art" width="${size}" height="${size}" viewBox="0 0 40 40">${DOODLE[name]}</svg>`;

            /* A skeletal formula from the site's own renderer (src/lib/molsvg.ts,
               run by render.mjs), framed on what was drawn, labels included,
               as on the site (src/components/Molecule.tsx). */
            function molecule(markup, boxW, boxH) {
                if (!markup) return null;
                const host = document.createElement('div');
                host.className = 'mol';
                host.style.cssText = `position:absolute;left:-10000px;top:0;width:${boxW}px;height:${boxH}px;visibility:hidden`;
                host.innerHTML = markup;
                document.body.appendChild(host);
                const svg = host.querySelector('svg');
                if (!svg) return host.remove(), null;
                try {
                    const b = svg.getBBox();
                    if (b.width > 0 && b.height > 0) {
                        const m = Math.max(2, Math.max(b.width, b.height) * 0.03);
                        // Never framed tighter than a mid-sized molecule in the
                        // box's own shape, so N₂O isn't blown up to fill the card
                        // while LSD and caffeine come out at one scale.
                        const w = Math.max(b.width + 2 * m, 260),
                            h = Math.max(b.height + 2 * m, 260 * (boxH / boxW));
                        svg.setAttribute('viewBox', `${b.x + b.width / 2 - w / 2} ${b.y + b.height / 2 - h / 2} ${w} ${h}`);
                        /* A peptide of three hundred atoms is drawn small: its lines
                           thin with it, so its rings stay open instead of filling in. */
                        const bond = 100 * Math.min(boxW / w, boxH / h);
                        svg.style.setProperty('--line', Math.max(1, Math.min(3.4, bond * 0.085)).toFixed(2) + 'px');
                    }
                } catch {
                    /* keep the renderer's frame */
                }
                const out = svg.outerHTML;
                host.remove();
                return out;
            }

            /* Shrinks a line until it fits its width; a name still too long
               for the smallest size wraps onto a second line. */
            function fit(el, max, start, least = 56) {
                let size = start;
                el.style.fontSize = size + 'px';
                while (el.scrollWidth > max && size > least) {
                    size -= 2;
                    el.style.fontSize = size + 'px';
                }
                if (el.scrollWidth > max) {
                    el.style.whiteSpace = 'normal';
                    el.style.overflowWrap = 'anywhere';
                    el.style.lineHeight = '1.08';
                }
            }

            /* The logo is a picture: wait for it, so no card is shot before it's in. */
            const settle = (card) => Promise.all([...card.querySelectorAll('img')].map((i) => i.decode().catch(() => {})));

            /* The molecule's box: the right of the card, nearly its full height. */
            const MOL = { right: 36, top: 36, w: 700, h: 558 };

            /* A substance's name, set so that every one of them reads, from LSD
               to a systematic name a hundred letters long. In order of
               preference:
                 beside     one line beside the drawing, as large as fits;
                 stacked    two or three lines beside it, broken between words;
                 across     one line across the card, the drawing moved below it;
                 lines      up to three lines across the card, broken where a
                            chemical name is broken: after a hyphen, around a
                            bracket, never inside a word;
                 cut        the same at the smallest size, cut short with an
                            ellipsis. No name in the catalogue needs it; a
                            card that does is reported by render.mjs.
               `col` is the width beside the drawing. Returns what it chose. */
            const ACROSS = 1040;
            const breakable = (name) =>
                esc(name)
                    .replace(/([^\s(\[])(?=[(\[])/g, '$1<wbr>')
                    .replace(/([-‐–)\]])(?=[^\s\-‐–)\],.;:'′’])/g, '$1<wbr>');
            function setName(el, name, col) {
                const plain = esc(name);
                const lines = () => Math.round(el.getBoundingClientRect().height / parseFloat(getComputedStyle(el).lineHeight));
                const fits = (width, size, wrap) => {
                    el.style.width = width + 'px';
                    el.style.fontSize = size + 'px';
                    el.style.whiteSpace = wrap ? 'normal' : 'nowrap';
                    el.style.lineHeight = wrap ? '1.1' : '1.02';
                    return el.scrollWidth <= width;
                };
                el.innerHTML = plain;
                for (let size = 112; size >= 76; size -= 2) if (fits(col, size, false)) return { mode: 'beside', size, lines: 1 };
                if (/\s/.test(name))
                    for (let size = 84; size >= 60; size -= 2)
                        if (fits(col, size, true) && lines() <= 3) return { mode: 'stacked', size, lines: lines() };
                for (let size = 96; size >= 56; size -= 2) if (fits(ACROSS, size, false)) return { mode: 'across', size, lines: 1 };
                el.innerHTML = breakable(name);
                el.style.textWrap = 'balance';
                for (let size = 64; size >= 40; size -= 2)
                    if (fits(ACROSS, size, true) && lines() <= 3) return { mode: 'lines', size, lines: lines() };
                fits(ACROSS, 40, true);
                el.style.overflowWrap = 'anywhere';
                el.style.display = '-webkit-box';
                el.style.webkitBoxOrient = 'vertical';
                el.style.webkitLineClamp = '3';
                el.style.overflow = 'hidden';
                return { mode: 'cut', size: 40, lines: 3 };
            }

            async function draw(kind, d) {
                const root = document.getElementById('root');
                root.innerHTML = '';
                let card;

                if (kind === 'site') {
                    const mol = molecule(d.molecule, MOL.w, MOL.h);
                    const textW = 1200 - MOL.w - MOL.right - 80 - 24;
                    card = $(`<div class="card">
                        <div style="position:absolute;left:80px;top:72px;width:${textW}px">
                            <div class="title" id="name">${esc(d.name)}</div>
                            <p class="muted" style="font-size:30px;margin-top:24px;line-height:1.32">${esc(d.kind)}</p>
                        </div>
                        <div class="mol" style="position:absolute;right:${MOL.right}px;top:${MOL.top}px;width:${MOL.w}px;height:${MOL.h}px">${mol}</div>
                        <div class="foot"><img src="../../public/logo.png" alt="" />${esc(d.host)}</div>
                    </div>`);
                    root.appendChild(card);
                    fit(card.querySelector('#name'), textW, 100);
                    await settle(card);
                    return;
                }

                /* A substance: its name, what kind of drug it is, and on the
                   right what the site draws for it: its structure, or the
                   doodle of the form it comes in where it has none (a kind of
                   drug, a lone atom), or its picture (寻寻). The drawing has
                   the right of the card to itself, from under the name when
                   the name runs across the card. */
                if (kind === 'substance') {
                    const art = d.molecule ? 'molecule' : d.picture ? 'picture' : 'doodle';
                    // The widest a picture or a tile is drawn, centred in the molecule's box.
                    const most = art === 'picture' ? 480 : 400;
                    const col = art === 'molecule' ? 1200 - MOL.w - MOL.right - 80 - 24 : 1200 - MOL.right - MOL.w / 2 - most / 2 - 80 - 40;
                    card = $(`<div class="card">
                        <div id="text" style="position:absolute;left:80px;top:72px;width:${ACROSS}px">
                            <div class="title" id="name"></div>
                            ${d.kind ? `<p class="muted" id="kind" style="font-size:30px;margin-top:24px;line-height:1.32;max-width:${col}px">${[].concat(d.kind).map(esc).join('<br />')}</p>` : ''}
                        </div>
                        <div class="foot"><img src="../../public/logo.png" alt="" />${esc(d.host)}</div>
                    </div>`);
                    // 正體中文 in its own PingFang, not the mainland's.
                    if (d.lang === 'zh-Hant') {
                        card.lang = 'zh-Hant';
                        card.style.fontFamily = `-apple-system, 'SF Pro Text', 'PingFang TC', sans-serif`;
                        card.querySelector('#name').style.fontFamily = `'SF Pro Display', -apple-system, 'PingFang TC', sans-serif`;
                    }
                    root.appendChild(card);
                    const nameEl = card.querySelector('#name');
                    const set = setName(nameEl, d.name, col);
                    const beside = set.mode === 'beside' || set.mode === 'stacked';

                    // Where the drawing goes: the whole box, or what is left of it under the name.
                    const top = beside ? MOL.top : Math.round(72 + nameEl.getBoundingClientRect().height + 20);
                    const room = MOL.top + MOL.h - top;
                    const boxH = d.drawn ? room - 52 : room;
                    let drawing;
                    if (art === 'molecule') {
                        drawing = `<div class="mol" style="position:absolute;right:${MOL.right}px;top:${top}px;width:${MOL.w}px;height:${boxH}px">${molecule(d.molecule, MOL.w, boxH)}</div>
                            ${d.drawn ? `<p class="muted" style="position:absolute;right:${MOL.right}px;top:${top + boxH + 8}px;width:${MOL.w}px;text-align:center;font-size:24px">${esc(d.drawn)}</p>` : ''}`;
                    } else {
                        const side = Math.min(most, boxH - (beside ? 40 : 0));
                        const at = `position:absolute;right:${MOL.right + (MOL.w - side) / 2}px;top:${top + (boxH - side) / 2}px;width:${side}px;height:${side}px;border-radius:${Math.round(side * 0.18)}px`;
                        drawing =
                            art === 'picture'
                                ? `<img class="picture" src="${esc(d.picture)}" alt="" style="${at}" />`
                                : `<div class="tile" style="${at}">${d.doodle || doodle('capsule', 300)}</div>`;
                    }
                    const foot = card.querySelector('.foot');
                    card.insertBefore($(`<div id="art">${drawing}</div>`), foot);
                    /* Beside a picture the logo and the host stand on the picture's
                       bottom edge, as on a report's card, not below it. */
                    if (art === 'picture') {
                        const edge = card.querySelector('.picture').getBoundingClientRect().bottom;
                        foot.style.bottom = Math.max(44, 630 - Math.round(edge)) + 'px';
                    }

                    // A long line under a tall name gives way before it reaches the foot.
                    const text = card.querySelector('#text');
                    const kindEl = card.querySelector('#kind');
                    const FLOOR = foot.getBoundingClientRect().top - 20;
                    for (let size = 30; kindEl && text.getBoundingClientRect().bottom > FLOOR && size > 22; size -= 2) kindEl.style.fontSize = size - 2 + 'px';

                    await settle(card);
                    /* What render.mjs checks of every card: that the name was
                       not cut and nothing runs past its place. */
                    const nameBox = nameEl.getBoundingClientRect();
                    return {
                        ...set,
                        ok:
                            set.mode !== 'cut' &&
                            nameEl.scrollWidth <= Math.ceil(nameBox.width) &&
                            nameBox.right <= 1200 - 80 + 1 &&
                            text.getBoundingClientRect().bottom <= FLOOR + 1 &&
                            boxH >= 240,
                    };
                }

                /* A report that closes on a wish: its picture on the left,
                   the wish beside it, in the language it was written in and
                   then in English. The report's own picture is line art, so
                   it is drawn in the doodles' ink as it is on the page (the
                   picture is the mask), cut square about its middle; a
                   report with only a closing picture shows that as it is. The
                   logo and the host sit on the picture’s bottom edge. */
                if (kind === 'report') {
                    card = $(`<div class="card">
                        ${d.line
                            ? `<div style="position:absolute;left:44px;top:63px;width:504px;height:504px;background:var(--brand);-webkit-mask:url('${esc(d.picture)}') center / cover no-repeat;mask:url('${esc(d.picture)}') center / cover no-repeat"></div>`
                            : `<img src="${esc(d.picture)}" alt="" style="position:absolute;left:44px;top:63px;width:504px;height:504px;object-fit:contain" />`}
                        <div style="position:absolute;left:588px;top:0;width:564px;height:524px;display:flex;flex-direction:column;justify-content:center">
                            <div id="wish" style="font-size:40px;line-height:1.42;letter-spacing:0.01em">${d.wish.map((l) => `<p style="white-space:nowrap">${esc(l)}</p>`).join('')}</div>
                            ${d.verse.length ? `<div id="verse" class="muted" style="margin-top:26px;font-size:24px;line-height:1.5">${d.verse.map((l) => `<p style="white-space:nowrap">${esc(l)}</p>`).join('')}</div>` : ''}
                        </div>
                        <div class="foot" style="left:588px;bottom:63px"><img src="../../public/logo.png" alt="" />${esc(d.host)}</div>
                    </div>`);
                    root.appendChild(card);
                    for (const id of ['wish', 'verse']) {
                        const el = card.querySelector('#' + id);
                        let size = el ? parseFloat(el.style.fontSize) : 0;
                        while (el && el.scrollWidth > 564 && size > 16) el.style.fontSize = --size + 'px';
                    }
                    /* A mask is no <img>: decode it here, so it is in before the shot. */
                    if (d.line) await Object.assign(new Image(), { src: d.picture }).decode().catch(() => {});
                    await settle(card);
                    return;
                }

                if (kind === 'mix') {
                    card = $(`<div class="card">
                        <p class="muted" style="position:absolute;left:80px;top:76px;font-size:34px">Can these be mixed?</p>
                        <div style="position:absolute;left:80px;top:150px;width:1040px;display:flex;align-items:center;gap:30px">
                            ${d.clover ? `<svg width="150" height="150" viewBox="0 0 24 24" fill="none" style="color:var(--positive);flex:none" stroke="var(--positive)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">${d.clover}</svg>` : ''}
                            <div class="reading title" id="word" style="color:${d.color}">${esc(d.word)}</div>
                        </div>
                        <p style="position:absolute;left:80px;top:372px;width:1040px;font-size:36px;line-height:1.4">${esc(d.meaning)}</p>
                        <div class="foot"><img src="../../public/logo.png" alt="" />${esc(d.host)}</div>
                    </div>`);
                    root.appendChild(card);
                    fit(card.querySelector('#word'), d.clover ? 860 : 1040, 160, 96);
                    await settle(card);
                }
            }
            window.draw = draw;
        </script>
    </body>
</html>
