<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Every tag below is the home page's. The Worker (worker/index.ts)
         rewrites them for each page it serves, so a shared link to a
         substance or a mix shows that page's own title, line and card. -->
    <title>Oyama Journal</title>
    <meta name="description" content="Doses, durations and what not to mix, for 3,000 psychoactive substances. Log what you take, on your device only. No sign-up." />
    <link rel="canonical" href="https://journal.mahiro.uk/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oyama Journal" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://journal.mahiro.uk/" />
    <meta property="og:title" content="Oyama Journal" />
    <meta property="og:description" content="Doses, durations and what not to mix, for 3,000 psychoactive substances. Log what you take, on your device only. No sign-up." />
    <meta property="og:image" content="https://journal.mahiro.uk/og/site.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Oyama Journal: doses, durations and what not to mix" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oyama Journal" />
    <meta name="twitter:description" content="Doses, durations and what not to mix, for 3,000 psychoactive substances. Log what you take, on your device only. No sign-up." />
    <meta name="twitter:image" content="https://journal.mahiro.uk/og/site.png" />
    <meta name="twitter:image:alt" content="Oyama Journal: doses, durations and what not to mix" />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Oyama Journal" />
    <meta name="apple-mobile-web-app-title" content="Journal" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Paint the right theme before the app loads, so dark never flashes white.
      try {
        var t = JSON.parse(localStorage.getItem('journal.theme.v2'));
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
      // And the page's language, so Chinese is set in its own typeface from the start.
      try {
        var l = JSON.parse(localStorage.getItem('journal.lang.v1'));
        if (!l) {
          var p = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          for (var i = 0; i < p.length; i++) {
            if (/^zh\b/i.test(p[i])) { l = 'zh-Hant'; break; }
            if (/^en\b/i.test(p[i])) break;
          }
        }
        if (l === 'zh-Hant') document.documentElement.lang = 'zh-Hant';
      } catch (e) {}
      // A plain name and icon, if the reader chose one (src/lib/quiet.ts):
      // put on before anything is drawn, or added to a Home Screen.
      try {
        var q = JSON.parse(localStorage.getItem('journal.quiet.v1'));
        if (q && typeof q.name === 'string' && q.name.trim()) {
          var n = q.name.trim().slice(0, 30);
          var at = function (s, a, v) { var e = document.querySelector(s); if (e) e.setAttribute(a, v); };
          document.title = n;
          at('link[rel="manifest"]', 'href', '/manifest.webmanifest?plain=' + encodeURIComponent(n));
          at('link[rel="apple-touch-icon"]', 'href', '/plain-180.png');
          at('link[rel="icon"][sizes="64x64"]', 'href', '/plain-64.png');
          at('link[rel="icon"][sizes="32x32"]', 'href', '/plain-64.png');
          at('meta[name="application-name"]', 'content', n);
          at('meta[name="apple-mobile-web-app-title"]', 'content', n);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- WeChat picks the first large picture in the page for its card. -->
    <div id="share-image" style="display: none"><img src="/og/site.png" alt="" width="1200" height="630" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
